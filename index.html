    <script>
      // Suppress benign third-party browser extension errors (e.g., MetaMask, Web3 wallets)
      (function() {
        var isExtensionError = function(msg, source) {
          var str = (msg || '') + ' ' + (source || '');
          return /metamask|ethereum|web3|solana|phantom|extension|chrome-extension|moz-extension/i.test(str);
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (typeof reason === 'string') ? reason : (reason && reason.message) ? reason.message : '';
          if (isExtensionError(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var src = event.filename || '';
          if (isExtensionError(msg, src)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
